<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Catalogue draft — accepted bilingual descriptions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #e9e2d8;
    }

    iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe id="catalogue" src="index.html" title="Draft customer catalogue"></iframe>

  <script src="tea-research.js"></script>
  <script>
    const VND_PER_USD = 26000;
    const frame = document.querySelector("#catalogue");

    frame.addEventListener("load", () => {
      const catalogue = frame.contentDocument;
      const cards = [...catalogue.querySelectorAll(".tea")];
      const previewStyles = catalogue.createElement("style");

      previewStyles.textContent = `
        .section:first-of-type {
          padding: 80px 48px;
        }

        .tea {
          grid-template-columns: 44px 220px minmax(0, 1fr) 168px;
          gap: 24px;
          padding: 38px 0;
        }

        .tea-photo {
          width: 220px;
          height: 220px;
        }

        .tea-idx {
          font-size: 12px;
        }

        .tea-name-row {
          align-items: flex-start;
          gap: 12px;
        }

        .tea-name {
          font-size: 32px;
        }

        .tea-name-row .tea-tags {
          order: -1;
          flex-basis: 100%;
          gap: 6px;
          margin-bottom: 2px;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.12em;
        }

        .tea-name-row .tea-tag {
          padding: 7px 12px;
          border-color: transparent;
          border-radius: 999px;
          background: oklch(0.32 0.03 50);
          color: oklch(0.97 0.01 75);
          box-shadow: 0 3px 10px oklch(0.2 0.02 50 / 0.14);
        }

        .tea-tags[data-preview-category="gaba"] .tea-tag {
          background: oklch(0.41 0.13 24);
        }

        .tea-tags[data-preview-category="puerh-shou"] .tea-tag {
          background: oklch(0.37 0.075 48);
        }

        .tea-tags[data-preview-category="puerh-sheng"] .tea-tag {
          background: oklch(0.4 0.09 125);
        }

        .tea-tags[data-preview-category="oolong"] .tea-tag {
          background: oklch(0.45 0.095 78);
        }

        .tea-tags[data-preview-category="white"] .tea-tag {
          background: oklch(0.35 0.035 240);
        }

        .tea-sub {
          max-width: none;
          margin-top: 12px;
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          column-gap: 20px;
          font-size: 14px;
          line-height: 1.5;
        }

        .catalogue-meta {
          grid-column: 1 / -1;
          margin-bottom: 10px;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 10px;
          letter-spacing: 0.04em;
        }

        .draft-copy {
          min-width: 0;
        }

        .tea-price {
          font-size: 15px;
          line-height: 1.7;
        }

        .tea-price strong {
          font-weight: 700;
        }
      `;

      catalogue.head.append(previewStyles);

      catalogue.title = "Roman&Julia teas · accepted draft";

      teaResearch.forEach(tea => {
        const card = cards.find(item => (
          item.querySelector(`img[src="${tea.photo}"]`)
        ));

        if (!card) return;

        const photo = card.querySelector(".tea-photo");
        const name = card.querySelector(".tea-name");
        const nameRow = card.querySelector(".tea-name-row");
        const description = card.querySelector(".tea-sub");
        const tags = card.querySelector(".tea-tags");
        const price = card.querySelector(".tea-price");
        const english = catalogue.createElement("span");
        const russian = catalogue.createElement("span");
        const tag = tags.querySelector(".tea-tag");

        photo.alt = tea.catalogueName || tea.targetName;
        name.textContent = tea.catalogueName || tea.targetName;

        if (tag.textContent.trim().toUpperCase() === "PUERH SHEN") {
          tag.textContent = "PUERH SHENG";
        }

        const tagText = tag.textContent.trim().toUpperCase();
        const category = tagText.includes("PUERH SHOU")
          ? "puerh-shou"
          : tagText.includes("PUERH SHENG")
            ? "puerh-sheng"
            : tagText.includes("GABA")
              ? "gaba"
              : tagText.includes("OOLONG")
                ? "oolong"
                : tagText.includes("WHITE") ? "white" : "other";

        tags.dataset.previewCategory = category;
        nameRow.append(tags);

        english.textContent = tea.draftEn;
        english.className = "draft-copy draft-copy--en";

        russian.lang = "ru";
        russian.textContent = tea.draftRu;
        russian.className = "draft-copy draft-copy--ru";

        description.replaceChildren();

        if (tea.catalogueMeta) {
          const meta = catalogue.createElement("span");
          meta.textContent = tea.catalogueMeta;
          meta.className = "catalogue-meta";
          description.append(meta);
        }

        description.append(english, russian);

        const priceRows = price.innerHTML.split(/<br\s*\/?>/i).map(row => row.trim());
        price.replaceChildren();

        priceRows.forEach(value => {
          const match = value.match(/^(\d+g)\s*·\s*([\d.]+)([km])\s*₫/i);
          if (!match) return;

          const amount = Number(match[2]) * (match[3].toLowerCase() === "m" ? 1000000 : 1000);
          const dollars = Math.round(amount / VND_PER_USD);
          const row = catalogue.createElement("div");
          const weight = catalogue.createElement("strong");

          weight.textContent = match[1];
          row.append(
            weight,
            catalogue.createTextNode(` · ${match[2]}${match[3]} ₫ · $${dollars}`)
          );
          price.append(row);
        });
      });
    });
  </script>
</body>
</html>
