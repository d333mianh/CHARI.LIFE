name: Telegram catalogue sync

# Mirrors teas.md into the @chariteas channel automatically. Runs on pushes that
# touch the catalogue (or on demand). State lives in telegram_state.json, which
# is committed back after each run so reruns edit existing posts instead of
# re-posting duplicates. Pruning (deleting posts for removed teas) stays manual.

on:
  push:
    branches: [main]
    paths:
      - teas.md
      - sets.html
      - links.json
      - photos/**
      - sync_telegram.py
  workflow_dispatch:
    inputs:
      prune:
        description: 'Delete channel posts for items no longer synced (removed, or marked data-telegram="skip")'
        type: boolean
        default: false

concurrency:
  group: telegram-sync          # never let two syncs race on the state file
  cancel-in-progress: false

permissions:
  contents: write               # to commit the updated state file back

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Push-triggered runs never prune. Pruning is opt-in and manual only:
        # Actions → Run workflow → tick "prune" (or `gh workflow run … -f prune=true`).
        run: python3 sync_telegram.py ${{ inputs.prune && '--prune' || '' }}

      - name: Commit updated state
        run: |
          if ! git diff --quiet telegram_state.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add telegram_state.json
            git commit -m "chore: sync telegram_state.json [skip ci]"
            git push
          else
            echo "state unchanged — nothing to commit"
          fi
